<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0a0a14">
<title>像素生日蛋糕 · Cake Pixel Player</title>
<style>
  html, body {
    margin: 0; height: 100%; overflow: hidden; background: #07070d;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
    font: 12px/1.3 -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  #stage {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    background: radial-gradient(circle at 50% 40%, #141026 0%, #07070d 70%);
  }
  #out {
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    box-shadow: 0 0 60px rgba(255, 90, 160, .18), 0 0 0 1px rgba(255, 255, 255, .06);
    border-radius: 6px;
    max-width: 94vw; max-height: 66vh;
  }
  #bar {
    position: fixed; left: 50%; bottom: max(14px, env(safe-area-inset-bottom));
    transform: translateX(-50%);
    display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 8px 10px;
    max-width: calc(100vw - 16px); padding: 10px 12px; border-radius: 16px;
    background: rgba(24, 24, 34, .88); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
    color: #fff; z-index: 10;
  }
  #bar button, #bar label.file {
    border: 0; border-radius: 10px; background: #3a4152; color: #fff;
    padding: 8px 10px; font: 600 12px/1 inherit; white-space: nowrap;
  }
  #bar button:active, #bar label.file:active { background: #59637a; }
  #bar .row { display: flex; align-items: center; gap: 6px; }
  #bar .row span { opacity: .7; font-size: 11px; }
  #bar input[type=range] { width: 84px; accent-color: #ff6b9d; }
  #bar input[type=file] { display: none; }
  #hint {
    position: fixed; left: 0; right: 0; top: max(10px, env(safe-area-inset-top));
    text-align: center; color: #6b7280; font-size: 11px; z-index: 9;
    pointer-events: none; transition: opacity .4s;
  }
  .gone { opacity: 0 !important; }
</style>
</head>
<body>
<div id="stage"><canvas id="out" width="720" height="720"></canvas></div>
<div id="hint">没选视频时播放内置动画 · 点「选视频」可以用你自己的</div>
<div id="bar">
  <label class="file" for="f">📹 选视频</label>
  <input id="f" type="file" accept="video/*">
  <div class="row"><span>像素</span><input id="pixel" type="range" min="1" max="16" step="1" value="4"></div>
  <div class="row"><span>大小</span><input id="size" type="range" min="240" max="900" step="20" value="480"></div>
  <button id="grid">格子 1×1</button>
  <button id="pause">⏸ 暂停</button>
  <button id="full">⛶ 全屏</button>
</div>
<script>
(function () {
  "use strict";

  var OUT = document.getElementById("out");
  var octx = OUT.getContext("2d");
  var SRC = document.createElement("canvas");
  SRC.width = SRC.height = 720;
  var sctx = SRC.getContext("2d");
  var SMALL = document.createElement("canvas");
  var smctx = SMALL.getContext("2d");

  var st = { pixel: 4, grid: 1, paused: false, video: null, t0: performance.now() };

  var bar = document.getElementById("bar");
  var hint = document.getElementById("hint");
  var pixelEl = document.getElementById("pixel");
  var sizeEl = document.getElementById("size");
  var gridBtn = document.getElementById("grid");
  var pauseBtn = document.getElementById("pause");

  // ---------- 内置动画：像素生日蛋糕 ----------
  var STARS = [];
  for (var i = 0; i < 46; i++) {
    STARS.push({ x: Math.random(), y: Math.random() * 0.62, r: 1 + Math.random() * 2, p: Math.random() * 6.28, s: 0.6 + Math.random() * 1.6 });
  }
  var SPRINKLES = [];
  for (var j = 0; j < 34; j++) {
    SPRINKLES.push({ x: 0.18 + Math.random() * 0.64, y: 0.55 + Math.random() * 0.3,
                     c: ["#ffd166", "#8ce0ff", "#ff94c2", "#b9a7ff"][j % 4] });
  }

  function roundRect(ctx, x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function drawCake(t) {
    var W = 720, H = 720;
    // 夜空
    var g = sctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, "#120c24");
    g.addColorStop(0.55, "#1a1030");
    g.addColorStop(1, "#241238");
    sctx.fillStyle = g;
    sctx.fillRect(0, 0, W, H);

    // 星星
    for (var i = 0; i < STARS.length; i++) {
      var s = STARS[i];
      var tw = 0.45 + 0.55 * Math.abs(Math.sin(t * s.s + s.p));
      sctx.globalAlpha = tw;
      sctx.fillStyle = "#ffffff";
      sctx.beginPath();
      sctx.arc(s.x * W, s.y * H, s.r, 0, 6.283);
      sctx.fill();
    }
    sctx.globalAlpha = 1;

    // 光晕
    var halo = sctx.createRadialGradient(W / 2, H * 0.5, 40, W / 2, H * 0.5, 320);
    halo.addColorStop(0, "rgba(255,120,180,0.22)");
    halo.addColorStop(1, "rgba(255,120,180,0)");
    sctx.fillStyle = halo;
    sctx.fillRect(0, 0, W, H);

    // 盘子
    sctx.fillStyle = "#3a2a4d";
    roundRect(sctx, 150, 590, 420, 26, 13);
    sctx.fill();

    // 三层蛋糕
    var tiers = [
      { x: 190, y: 470, w: 340, h: 120, c: "#ff8fb8", c2: "#ffb3cf", r: 16 },
      { x: 225, y: 380, w: 270, h: 100, c: "#ffd9a0", c2: "#ffe9c7", r: 14 },
      { x: 255, y: 300, w: 210, h: 88,  c: "#c9a7ff", c2: "#ddc7ff", r: 12 }
    ];
    tiers.forEach(function (tr) {
      var lg = sctx.createLinearGradient(tr.x, tr.y, tr.x + tr.w, tr.y + tr.h);
      lg.addColorStop(0, tr.c);
      lg.addColorStop(1, tr.c2);
      sctx.fillStyle = lg;
      roundRect(sctx, tr.x, tr.y, tr.w, tr.h, tr.r);
      sctx.fill();
      // 顶部奶油
      sctx.fillStyle = "rgba(255,255,255,0.55)";
      roundRect(sctx, tr.x + 6, tr.y, tr.w - 12, 16, 8);
      sctx.fill();
    });

    // 糖粒
    for (var k = 0; k < SPRINKLES.length; k++) {
      var sp = SPRINKLES[k];
      sctx.fillStyle = sp.c;
      sctx.beginPath();
      sctx.arc(sp.x * W, sp.y * H, 3.4, 0, 6.283);
      sctx.fill();
    }

    // 蜡烛
    var candles = [320, 360, 400];
    candles.forEach(function (cx, idx) {
      sctx.fillStyle = "#fff6e8";
      sctx.fillRect(cx - 6, 240, 12, 62);
      sctx.fillStyle = "rgba(255,255,255,0.65)";
      sctx.fillRect(cx - 6, 240, 4, 62);
      // 火焰
      var fl = 1 + 0.18 * Math.sin(t * 9 + idx * 2.1);
      var fy = 240;
      sctx.beginPath();
      sctx.ellipse(cx, fy - 12 * fl, 7, 14 * fl, 0, 0, 6.283);
      sctx.fillStyle = "rgba(255,190,80,0.95)";
      sctx.fill();
      sctx.beginPath();
      sctx.ellipse(cx, fy - 10 * fl, 3.4, 8 * fl, 0, 0, 6.283);
      sctx.fillStyle = "rgba(255,250,210,0.98)";
      sctx.fill();
      // 烛光
      var cg = sctx.createRadialGradient(cx, fy - 14, 2, cx, fy - 14, 58);
      cg.addColorStop(0, "rgba(255,200,120,0.30)");
      cg.addColorStop(1, "rgba(255,200,120,0)");
      sctx.fillStyle = cg;
      sctx.fillRect(cx - 60, fy - 74, 120, 120);
    });

    // 文字
    sctx.save();
    sctx.textAlign = "center";
    sctx.shadowColor = "rgba(255,120,180,0.9)";
    sctx.shadowBlur = 26;
    sctx.fillStyle = "#fff0f6";
    sctx.font = "700 46px 'Trebuchet MS', 'PingFang SC', sans-serif";
    sctx.fillText("Happy Birthday", 360, 650);
    sctx.restore();
  }

  // ---------- 视频源 ----------
  var videoEl = document.createElement("video");
  videoEl.muted = true;
  videoEl.loop = true;
  videoEl.playsInline = true;
  videoEl.setAttribute("playsinline", "");
  document.getElementById("f").addEventListener("change", function (e) {
    var file = e.target.files && e.target.files[0];
    if (!file) return;
    if (st.url) URL.revokeObjectURL(st.url);
    st.url = URL.createObjectURL(file);
    videoEl.src = st.url;
    videoEl.play().catch(function () {});
    st.video = videoEl;
    hint.classList.add("gone");
  });

  function drawSource(t) {
    var W = 720;
    if (st.video && st.video.readyState >= 2) {
      var vw = st.video.videoWidth, vh = st.video.videoHeight;
      var side = Math.min(vw, vh);
      sctx.drawImage(st.video, (vw - side) / 2, (vh - side) / 2, side, side, 0, 0, W, W);
    } else {
      drawCake(t);
    }
  }

  // ---------- 主循环 ----------
  function render(now) {
    var t = (now - st.t0) / 1000;
    if (!st.paused) drawSource(t);

    var cell = 720;
    var factor = Math.max(1, st.pixel);
    var sw = Math.max(8, Math.round(cell / factor));
    if (SMALL.width !== sw) { SMALL.width = SMALL.height = sw; }
    smctx.imageSmoothingEnabled = true;
    smctx.clearRect(0, 0, sw, sw);
    smctx.drawImage(SRC, 0, 0, sw, sw);

    var g = st.grid;
    var total = cell * g;
    if (OUT.width !== total) { OUT.width = OUT.height = total; }
    octx.imageSmoothingEnabled = false;
    for (var r = 0; r < g; r++) {
      for (var c = 0; c < g; c++) {
        octx.drawImage(SMALL, c * cell, r * cell, cell, cell);
      }
    }
    requestAnimationFrame(render);
  }

  // ---------- 控件 ----------
  pixelEl.addEventListener("input", function () { st.pixel = +pixelEl.value; });
  sizeEl.addEventListener("input", function () {
    var px = +sizeEl.value;
    OUT.style.width = px + "px";
    OUT.style.height = "auto";
  });
  OUT.style.width = sizeEl.value + "px";

  gridBtn.addEventListener("click", function () {
    st.grid = st.grid === 1 ? 2 : (st.grid === 2 ? 3 : 1);
    gridBtn.textContent = "格子 " + st.grid + "×" + st.grid;
  });
  pauseBtn.addEventListener("click", function () {
    st.paused = !st.paused;
    pauseBtn.textContent = st.paused ? "▶ 继续" : "⏸ 暂停";
    if (st.video) { st.paused ? st.video.pause() : st.video.play().catch(function () {}); }
  });
  document.getElementById("full").addEventListener("click", function () {
    var el = document.documentElement;
    if (!document.fullscreenElement && el.requestFullscreen) el.requestFullscreen().catch(function () {});
    else if (document.exitFullscreen) document.exitFullscreen();
  });
  document.getElementById("stage").addEventListener("click", function (e) {
    if (e.target === OUT) bar.classList.toggle("gone");
  });
  setTimeout(function () { hint.classList.add("gone"); }, 7000);

  requestAnimationFrame(render);
})();
</script>
</body>
</html>
